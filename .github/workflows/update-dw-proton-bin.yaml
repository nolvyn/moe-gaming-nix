name: Update dw-proton-bin

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Get latest stable version
        id: get-version
        run: |
          VERSION=$(curl -s "https://dawn.wine/api/v1/repos/dawn-winery/dwproton/releases?limit=10&pre-release=false" \
            | jq -r '[.[] | select(.prerelease == false)] | first | .tag_name' \
            | sed 's/^dwproton-//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Run nix-update
        run: |
          nix run nixpkgs#nix-update -- --flake dw-proton-bin \
            --version-regex 'dwproton-(.+)' \
            --version ${{ steps.get-version.outputs.version }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkgs/dw-proton-bin/package.nix
          if ! git diff --staged --quiet; then
            git commit -m "dw-proton-bin: update to latest"
            git push
          fi
