name: Update dw-proton-bin

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Run nix-update
        run: |
          nix run nixpkgs#nix-update -- --flake dw-proton-bin \
            --version-regex 'dwproton-(.+)' \
            --version-type stable

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "dw-proton-bin: update to latest"
          title: "dw-proton-bin: auto-update"
          branch: auto-update/dw-proton-bin
          delete-branch: true
